name: Test and deploy Cloudflare Worker

on:
  push:
    branches: [cloudflare-d1-preparation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 224event-cloudflare-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    name: Critical tests (no production access)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify all 31 original migrations plus Worker runtime migration
        run: |
          npm run migrations:generate
          test "$(find migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')" = "32"
          git diff --exit-code -- migrations
      - name: Apply migrations to isolated LOCAL D1 only
        run: npx wrangler d1 migrations apply 224event-db --local
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Typecheck, legacy regressions, real Worker/D1 concurrency and rollback tests, mobile browser end-to-end
        run: npm run check:critical
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 224event-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    name: Migrate, deploy, verify workers.dev
    needs: validate
    if: github.ref == 'refs/heads/cloudflare-d1-preparation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Require existing Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Apply reviewed migrations to production after critical tests pass
        run: npx wrangler d1 migrations apply 224event-db --remote
      - name: Deploy Worker and static assets
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deployment.log
      - name: Sync supplied application secrets, preserving existing Worker secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_STAFF_CHAT_ID: ${{ secrets.TELEGRAM_STAFF_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: node scripts/sync-worker-secrets.mjs
      - name: Register Telegram webhook when credentials are available
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: node scripts/register-webhook.mjs
      - name: Verify live database, menu, frontend, assets and security boundaries
        run: node scripts/verify-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 224event-deployment
          path: |
            deployment.log
            live-verification.json
          if-no-files-found: ignore
