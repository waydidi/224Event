name: Validate Cloudflare D1 migrations

on:
  push:
    branches: [cloudflare-d1-preparation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Generate all database migrations
        run: |
          node scripts/export-d1-migrations.mjs
          test "$(find migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')" = "31"
      - name: Upload generated migrations for review
        uses: actions/upload-artifact@v4
        with:
          name: 224event-d1-sql
          path: migrations/*.sql
          if-no-files-found: error
      - name: Validate schema and seed data in LOCAL D1 (no production writes)
        run: npx --yes wrangler@4 d1 migrations apply 224event-db --local
      - name: Run Node application acceptance and resilience tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
