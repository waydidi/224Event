name = "224event"
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/receipt-logo.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "224event-db"
database_id = "6e7236c4-b3ed-4d93-bc73-71f5e80a9b9d"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[vars]
DISPLAY_TIMEZONE = "Asia/Bangkok"
