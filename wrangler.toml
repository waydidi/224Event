# Cloudflare D1 binding for the planned Workers migration.
# NOTE: This repository currently runs on Node.js/node:sqlite and is NOT yet
# deployable as a Worker. Do not run wrangler deploy until the server, database
# layer, outbox and PDF generation have been ported and tested.
name = "224event"
compatibility_date = "2026-10-17"

[[d1_databases]]
binding = "DB"
database_name = "224event-db"
database_id = "6e7236c4-b3ed-4d93-bc73-71f5e80a9b9d"
migrations_dir = "migrations"
